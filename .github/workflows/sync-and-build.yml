name: Build Custom Release

# Fork bientavu/rdt-client = upstream rogerfar/rdt-client + one patch (QBittorrent.cs:
# report LOCAL download progress, counted per file; ETA from the first local download
# start). Run this by hand with the upstream tag to rebuild: it merges the tag into
# `custom`, tests, and publishes ghcr.io/bientavu/rdt-client:<tag>-dlprogress.
#
# The tag pushed below starts with "v" like upstream's, but tags pushed with
# GITHUB_TOKEN never trigger other workflows, so upstream's tag-triggered release
# workflows (Docker Hub, Windows zip) stay idle. Never push a v* tag by hand.

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream release tag to build (e.g., v2.0.142)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-custom-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream tag and merge
        run: |
          git remote add upstream https://github.com/rogerfar/rdt-client.git
          git fetch upstream tag ${{ inputs.upstream_tag }}

          # A conflict must FAIL the job: carrying on would publish the pre-merge code
          # under the new version.
          if ! git merge ${{ inputs.upstream_tag }} --no-edit; then
            echo "::error::Merge conflict with ${{ inputs.upstream_tag }}. Resolve it locally on custom, push, then re-run."
            git merge --abort
            exit 1
          fi

      # Upstream rewrites QBittorrent.cs often: a clean merge can still break the patch.
      - name: Test
        run: |
          docker run --rm -v "$PWD/server:/src" -w /src mcr.microsoft.com/dotnet/sdk:10.0 \
            dotnet test RdtClient.Service.Test

      # Same as upstream's build-docker-image.yml: the csproj says 1.0.0, so without this
      # the UI shows "v1.0.0" and a permanent update banner. Plain upstream number (an
      # AssemblyVersion can't carry a suffix): the banner then only appears when upstream
      # really ships a newer release, i.e. when this workflow should be re-run.
      # Working-tree only, never committed.
      - name: Stamp version
        run: |
          VERSION="${{ inputs.upstream_tag }}"; VERSION="${VERSION#v}"
          sed -i "s|<Version>.*</Version>|<Version>$VERSION</Version>|" server/RdtClient.Web/RdtClient.Web.csproj
          sed -i "s|<AssemblyVersion>.*</AssemblyVersion>|<AssemblyVersion>$VERSION</AssemblyVersion>|" server/RdtClient.Web/RdtClient.Web.csproj

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ inputs.upstream_tag }}-dlprogress
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.upstream_tag }}-dlprogress
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Last, so a failed build leaves no tag behind and the job can simply be re-run.
      - name: Push merge and tag
        run: |
          git push origin HEAD:custom
          git tag ${{ inputs.upstream_tag }}-dlprogress
          git push origin ${{ inputs.upstream_tag }}-dlprogress
